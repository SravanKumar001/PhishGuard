services:
  phishguard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PHISHGUARD_ENVIRONMENT: production
      PHISHGUARD_DATABASE_URL: sqlite:////data/phishguard.db
      PHISHGUARD_ALLOWED_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
    volumes:
      - phishguard-data:/data

volumes:
  phishguard-data:
